<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConversacionIA — Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #04040c;
            --accent: #6c63ff;
            --accent2: #a78bfa;
            --green: #10b981;
            --red: #ef4444;
            --text-final: #ffffff;
            --text-interim: #a78bfa;
            --muted: #3a3a5a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-final);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(108, 99, 255, 0.10) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(167, 139, 250, 0.05) 0%, transparent 60%);
        }

        /* ── Top bar ─────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .topbar .logo {
            font-size: 0.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar .indicators {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            transition: all 0.3s;
        }

        .indicator.ws-ok .dot {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .indicator.grabando .dot {
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
            animation: blink 1s infinite;
        }

        /* ── Mute Button ────────────────────────────── */
        .mute-btn {
            background: rgba(108, 99, 255, 0.15);
            border: 1px solid rgba(108, 99, 255, 0.4);
            color: #f0f0ff;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mute-btn:hover {
            background: rgba(108, 99, 255, 0.3);
            border-color: var(--accent2);
        }

        .mute-btn.muted {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        /* ── AI Response Box ──────────────────────── */
        .ai-container {
            max-width: 900px;
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            margin-top: 1.5rem;
            background: rgba(15, 15, 30, 0.85);
            border: 1px solid rgba(167, 139, 250, 0.35);
            border-radius: 16px;
            padding: 1.25rem 1.75rem;
            backdrop-filter: blur(12px);
            text-align: left;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.4s ease;
            scrollbar-width: thin;
            scrollbar-color: rgba(167, 139, 250, 0.4) transparent;
        }

        .ai-container::-webkit-scrollbar {
            width: 6px;
        }

        .ai-container::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.4);
            border-radius: 10px;
        }

        .ai-container.visible {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            background: rgba(15, 15, 30, 0.95);
            z-index: 2;
        }

        .ai-badge {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent2);
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-status {
            font-size: 0.75rem;
            color: #fbbf24;
            font-style: italic;
        }

        .ai-text {
            font-size: clamp(1rem, 1.8vw, 1.25rem);
            line-height: 1.65;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* ── Main content ───────────────────── */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 5vw 7rem 5vw;
            position: relative;
        }

        .transcript-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            opacity: 0.4;
            transition: opacity 0.5s;
            margin-top: 10vh;
        }

        .empty-state.hidden {
            display: none;
        }

        .empty-icon {
            font-size: 4rem;
        }

        .empty-state p {
            font-size: 1.1rem;
            color: var(--muted);
        }

        /* Text display */
        .transcript-text {
            font-size: clamp(1.3rem, 2.8vw, 2.2rem);
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: -0.01em;
            display: none;
            margin-bottom: 1rem;
        }

        .transcript-text.visible {
            display: block;
        }

        .transcript-text .final-part {
            color: var(--text-final);
        }

        .transcript-text .interim-part {
            color: var(--text-interim);
            font-style: italic;
        }

        /* Word-by-word fade-in animation */
        .word {
            display: inline-block;
            animation: fadeWord 0.3s ease both;
        }

        @keyframes fadeWord {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Active recording indicator at bottom */
        .live-badge {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 100px;
            padding: 0.4rem 1.1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fca5a5;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .live-badge.visible {
            opacity: 1;
        }

        .live-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1s infinite;
        }

        /* Cursor blink when active */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background: var(--accent2);
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 2px;
            animation: cursorBlink 1s infinite;
            opacity: 0;
        }

        .cursor.visible {
            opacity: 1;
        }

        @keyframes cursorBlink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="logo">⚡ ConversacionIA <span
                style="font-size:0.7em; opacity:0.6; margin-left:8px; font-weight:normal;">Guía Capilla Sixtina</span>
        </div>
        <div class="indicators">
            <button class="mute-btn" id="muteBtn" title="Activar/Desactivar Voz de la IA">🔊 Voz activada</button>
            <div class="indicator" id="wsIndicator">
                <div class="dot"></div>
                <span id="wsLabel">Conectando…</span>
            </div>
            <div class="indicator" id="grabIndicator">
                <div class="dot"></div>
                <span id="grabLabel">Sin grabador</span>
            </div>
        </div>
    </div>

    <div class="stage">
        <div class="transcript-container">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">🏛️</div>
                <p>Esperando la pregunta del grabador sobre la Capilla Sixtina…</p>
            </div>

            <div class="transcript-text" id="transcriptText">
                <span class="final-part" id="finalPart"></span><span class="interim-part" id="interimPart"></span><span
                    class="cursor" id="cursor"></span>
            </div>

            <div class="ai-container" id="aiContainer">
                <div class="ai-header">
                    <span class="ai-badge">🤖 Guía Capilla Sixtina</span>
                    <span class="ai-status" id="aiStatus">Pensando…</span>
                </div>
                <div class="ai-text" id="aiText"></div>
            </div>
        </div>
    </div>

    <div class="live-badge" id="liveBadge">
        <div class="dot"></div> En vivo
    </div>

    <script>
        // ── DOM ──────────────────────────────────────────────────────────────────
        const wsIndicator = document.getElementById('wsIndicator');
        const wsLabel = document.getElementById('wsLabel');
        const grabIndicator = document.getElementById('grabIndicator');
        const grabLabel = document.getElementById('grabLabel');
        const emptyState = document.getElementById('emptyState');
        const transcriptText = document.getElementById('transcriptText');
        const finalPart = document.getElementById('finalPart');
        const interimPart = document.getElementById('interimPart');
        const cursor = document.getElementById('cursor');
        const liveBadge = document.getElementById('liveBadge');

        const aiContainer = document.getElementById('aiContainer');
        const aiStatus = document.getElementById('aiStatus');
        const aiText = document.getElementById('aiText');
        const muteBtn = document.getElementById('muteBtn');

        let hasContent = false;
        let isMuted = false;
        let fullAIText = '';
        let spokenIndex = 0;

        // ── Mute Button ──────────────────────────────────────────────────────────
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                muteBtn.classList.add('muted');
                muteBtn.innerHTML = '🔇 Voz silenciada';
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            } else {
                muteBtn.classList.remove('muted');
                muteBtn.innerHTML = '🔊 Voz activada';
                // Speak remaining text if any
                if (fullAIText && spokenIndex < fullAIText.length) {
                    speakText(fullAIText.substring(spokenIndex));
                }
            }
        });

        // ── Text To Speech (TTS) ─────────────────────────────────────────────────
        function speakText(text) {
            if (isMuted || !('speechSynthesis' in window)) return;
            const cleanText = text.trim();
            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            // Try selecting a good Spanish voice
            const voices = window.speechSynthesis.getVoices();
            const esVoice = voices.find(v => v.lang.startsWith('es'));
            if (esVoice) utterance.voice = esVoice;

            window.speechSynthesis.speak(utterance);
        }

        // ── WebSocket ────────────────────────────────────────────────────────────
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ role: 'display' }));
                wsIndicator.className = 'indicator ws-ok';
                wsLabel.textContent = 'Conectado';
            };

            ws.onclose = () => {
                wsIndicator.className = 'indicator';
                wsLabel.textContent = 'Desconectado';
                setTimeout(connectWS, 3000);
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);

                if (msg.grabadores !== undefined) {
                    const active = msg.grabadores > 0;
                    grabIndicator.className = 'indicator' + (active ? ' grabando' : '');
                    grabLabel.textContent = active ? `Grabando (${msg.grabadores})` : 'Sin grabador';
                    cursor.className = 'cursor' + (active ? ' visible' : '');
                }

                if (msg.type === 'SYNC_STATE' || msg.type === 'transcript') {
                    showTranscript(msg.finalText, msg.interimText);
                    liveBadge.classList.add('visible');
                    clearTimeout(liveBadge._timer);
                    liveBadge._timer = setTimeout(() => liveBadge.classList.remove('visible'), 3000);

                    grabIndicator.className = 'indicator grabando';
                    grabLabel.textContent = 'En vivo…';
                    cursor.className = 'cursor visible';
                }

                // ── AI Events ──
                if (msg.type === 'AI_THINKING') {
                    aiContainer.classList.add('visible');
                    aiStatus.textContent = 'Pensando respuesta (Capilla Sixtina)…';
                    aiText.textContent = '';
                    fullAIText = '';
                    spokenIndex = 0;
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                }

                if (msg.type === 'AI_STREAM_START') {
                    aiContainer.classList.add('visible');
                    aiStatus.textContent = 'Respondiendo…';
                    aiText.textContent = '';
                    fullAIText = '';
                    spokenIndex = 0;
                }

                if (msg.type === 'AI_STREAM_CHUNK') {
                    aiContainer.classList.add('visible');
                    fullAIText += msg.chunk;
                    aiText.textContent = fullAIText;
                    aiContainer.scrollTop = aiContainer.scrollHeight;
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

                    // Speak sentence by sentence
                    const unSpoken = fullAIText.substring(spokenIndex);
                    const sentenceMatch = unSpoken.match(/^.*?[.?!]\s/);
                    if (sentenceMatch) {
                        const sentenceToSpeak = sentenceMatch[0];
                        spokenIndex += sentenceToSpeak.length;
                        speakText(sentenceToSpeak);
                    }
                }

                if (msg.type === 'AI_STREAM_END') {
                    aiStatus.textContent = 'Respuesta completada ✓';
                    if (msg.fullText) fullAIText = msg.fullText;
                    aiText.textContent = fullAIText;
                    aiContainer.scrollTop = aiContainer.scrollHeight;
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

                    // Speak remaining text at the end
                    if (spokenIndex < fullAIText.length) {
                        const remaining = fullAIText.substring(spokenIndex);
                        spokenIndex = fullAIText.length;
                        speakText(remaining);
                    }
                }

                if (msg.type === 'clear') {
                    clearDisplay();
                }
            };
        }

        // ── Display ──────────────────────────────────────────────────────────────
        function showTranscript(finalText, interimText) {
            const f = (finalText || '').trim();
            const i = (interimText || '').trim();

            if (!f && !i) {
                if (hasContent) clearDisplay();
                return;
            }

            if (!hasContent) {
                emptyState.classList.add('hidden');
                transcriptText.classList.add('visible');
                hasContent = true;
            }

            finalPart.textContent = f;
            interimPart.textContent = i ? (f ? ' ' : '') + i : '';
        }

        function clearDisplay() {
            finalPart.innerHTML = '';
            interimPart.textContent = '';
            finalTextStore = '';
            hasContent = false;
            emptyState.classList.remove('hidden');
            transcriptText.classList.remove('visible');
            emptyState.querySelector('p').textContent = 'Esperando al grabador…';
            cursor.className = 'cursor';
        }

        // ── Init ─────────────────────────────────────────────────────────────────
        connectWS();
    </script>
</body>

</html>
